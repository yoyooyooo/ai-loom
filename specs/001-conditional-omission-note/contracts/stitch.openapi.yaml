openapi: 3.0.3
info:
  title: AILoom Stitch API
  version: '1.0.0'
paths:
  /api/stitch:
    post:
      summary: Generate stitched annotation prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  description: 'concise | detailed'
                maxChars:
                  type: integer
                annotationIds:
                  type: array
                  items:
                    type: string
              required: [templateId, maxChars]
      responses:
        '200':
          description: Stitched prompt
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt:
                    type: string
                    description: |
                      拼接后的 prompt 文本。首行“说明”按需出现：仅当正文中存在 `<<<OMITTED ~N CHARS>>>` 或 `<<<OMITTED ~N LINES>>>` 时包含；否则不包含。
                  stats:
                    type: object
                    properties:
                      total:
                        type: integer
                      used:
                        type: integer
                      truncated:
                        type: boolean
                      chars:
                        type: integer
