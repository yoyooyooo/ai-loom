<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单统计卡片</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .tcloud-number {
      font-family: 'Inter', monospace;
      font-feature-settings: 'tnum';
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-8">
  
  <!-- Stats Card -->
  <div class="relative bg-white rounded-lg shadow-lg p-4 w-[296px]">
    
    <!-- Historical High Badge (Top Right) -->
    <div class="absolute top-2 right-2 flex items-center gap-1 bg-emerald-50 px-2 py-1 rounded">
      <!-- Trend Up Icon -->
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6" cy="6" r="6" fill="#30bf84"/>
        <path d="M8 4L8 8L4 8" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 4L8 8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="text-xs text-gray-600">历史新高</span>
      <!-- Right Chevron -->
      <svg width="5" height="7" viewBox="0 0 5 7" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L4 3.5L1 6" stroke="#444757" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    
    <!-- Main Content -->
    <div class="flex flex-col gap-4">
      
      <!-- Title and Value Section -->
      <div class="flex flex-col gap-3">
        <h3 class="text-sm font-semibold text-gray-900 underline">总订单量</h3>
        
        <!-- Value Display -->
        <div class="flex flex-col gap-0.5">
          <div class="text-2xl font-bold text-gray-900 tcloud-number leading-8">100,000,000</div>
          
          <!-- MoM Indicator -->
          <div class="flex items-center gap-1">
            <span class="text-xs text-gray-500">MoM</span>
            <div class="flex items-center gap-0.5 text-red-500">
              <!-- Down Arrow -->
              <svg width="9" height="9" viewBox="0 0 9 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.5 1V8M4.5 8L1.5 5M4.5 8L7.5 5" stroke="#f23730" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="text-xs font-semibold">1.7%</span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Mini Chart and Legend Section -->
      <div class="flex flex-col gap-3">
        
        <!-- Mini Chart -->
        <div class="flex h-2 rounded-sm overflow-hidden">
          <div class="bg-[#4f6fff]" style="width: 81.06%;"></div>
          <div class="bg-[#41d9cc]" style="width: 7.58%;"></div>
          <div class="bg-[#fdb34c]" style="width: 7.58%;"></div>
          <div class="bg-[#d278ff]" style="width: 3.78%;"></div>
        </div>
        
        <!-- Legend -->
        <div class="flex flex-col gap-2">
          
          <!-- Legend Item 1 -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <div class="w-2 h-2 rounded-sm bg-[#4f6fff]"></div>
              <span class="text-xs font-semibold text-gray-600">跨境</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-xs text-gray-900 tcloud-number">90.2</span>
              <span class="text-[10px] font-semibold text-gray-600">%</span>
            </div>
          </div>
          
          <!-- Legend Item 2 -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <div class="w-2 h-2 rounded-sm bg-[#41d9cc]"></div>
              <span class="text-xs font-semibold text-gray-600">FM</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-xs text-gray-900 tcloud-number">90.2</span>
              <span class="text-[10px] font-semibold text-gray-600">%</span>
            </div>
          </div>
          
          <!-- Legend Item 3 -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <div class="w-2 h-2 rounded-sm bg-[#fdb34c]"></div>
              <span class="text-xs font-semibold text-gray-600">W2D</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-xs text-gray-900 tcloud-number">90.2</span>
              <span class="text-[10px] font-semibold text-gray-600">%</span>
            </div>
          </div>
          
          <!-- Legend Item 4 -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <div class="w-2 h-2 rounded-sm bg-[#d278ff]"></div>
              <span class="text-xs font-semibold text-gray-600">D2D</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-xs text-gray-900 tcloud-number">90.2</span>
              <span class="text-[10px] font-semibold text-gray-600">%</span>
            </div>
          </div>
          
        </div>
      </div>
      
    </div>
  </div>
  
</body>
</html>
